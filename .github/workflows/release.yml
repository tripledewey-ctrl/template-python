name: Release

# Ausgeloest durch Tags:
#   v1.2.0rc1  -> Pre-Release (Release Candidate), nur von release/1.2
#   v1.2.0     -> finales Release, muss auf denselben Commit zeigen wie ein RC-Tag v1.2.0rcN
# workflow_dispatch wird von tag-release.yml mit --ref <tag> aufgerufen.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_FROZEN: "1"

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag, Branch und Release-Candidate pruefen
        id: check
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "${REF_TYPE}" != "tag" ]]; then
            echo "::error::Release nur von einem Tag aus starten (aktuell: ${REF_TYPE})."
            exit 1
          fi
          if [[ ! "${TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(rc[0-9]+)?$ ]]; then
            echo "::error::Tag '${TAG}' ungueltig. Erlaubt: vX.Y.Z oder vX.Y.ZrcN"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"; rc="${BASH_REMATCH[4]}"
          version="${TAG#v}"
          sha="$(git rev-list -n1 "${TAG}")"
          branch="origin/release/${major}.${minor}"
          if ! git branch -r --contains "${sha}" | grep -qxE "\s*${branch}"; then
            echo "::error::Commit ${sha} liegt nicht auf ${branch}. Releases werden nur von release/${major}.${minor} getaggt."
            exit 1
          fi
          if [[ -z "${rc}" ]]; then
            if ! git tag --points-at "${sha}" | grep -qE "^v${major}\.${minor}\.${patch}rc[0-9]+$"; then
              echo "::error::Finales Release ${TAG} braucht einen RC-Tag (v${major}.${minor}.${patch}rcN) auf demselben Commit."
              exit 1
            fi
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Release ${version} (Pre-Release: ${rc:+ja}${rc:-nein}) von ${branch} @ ${sha}"

  ci:
    name: ci
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.os }})
    needs: [verify, ci]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Version pruefen
        shell: bash
        env:
          EXPECTED: ${{ needs.verify.outputs.version }}
        run: |
          actual="$(uv run python -c 'import bildfinder; print(bildfinder.__version__)')"
          echo "Paketversion: ${actual}"
          test "${actual}" = "${EXPECTED}"
      - name: Wheel + sdist
        if: runner.os == 'Linux'
        run: uv run poe build
      - name: Exe bauen
        run: uv run --group exe poe build-exe
      - name: Smoke-Test
        shell: bash
        run: |
          exe=$(ls dist/bildfinder-*-*-* | head -n1)
          mkdir -p smoke && printf 'x' > smoke/test.png
          "./${exe}" --cli smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksummen
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Build-Provenance (SLSA) signieren
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: GitHub Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes --title "Bildfinder ${TAG}")
          if [[ "${PRERELEASE}" == "true" ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" "${flags[@]}"
