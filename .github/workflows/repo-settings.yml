name: Repo konfigurieren

# Setzt Sicherheitseinstellungen, Environment "release" und Rulesets
# (.github/rulesets/) per scripts/configure_github.py.
# Benoetigt das Secret REPO_ADMIN_TOKEN: fine-grained PAT nur fuer dieses Repo
# mit "Administration: Read and write". Nach dem Lauf Secret und Token wieder loeschen.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, nichts aendern"
        type: boolean
        default: false

permissions: {}

jobs:
  configure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Einstellungen anwenden
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ -z "${GITHUB_TOKEN}" ]]; then
            echo "::error::Secret REPO_ADMIN_TOKEN fehlt."
            exit 1
          fi
          args=(--repo "${GITHUB_REPOSITORY}")
          if [[ "${DRY_RUN}" == "true" ]]; then args+=(--dry-run); fi
          python3 scripts/configure_github.py "${args[@]}"
